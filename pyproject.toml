[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xyt-gps"
version = "1.0.0"
description = "Pipeline GPS vers donnees de mobilite structurees et indicateurs."
readme = "README.md"
# Supported range validated with the current geospatial dependency stack.
# Relax to Python 3.13+ only after tests and package-ready notebooks pass there.
requires-python = ">=3.10,<3.13"
license = "PolyForm-Noncommercial-1.0.0"
license-files = [
  "LICENSE",
  "LICENSE.docs",
  "LICENSE.sample-data.md",
  "NOTICE.md",
]
authors = [
  { name = "Bureau Action Située" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "pandas>=2.2,<3.0",
  "geopandas>=0.14,<2.0",
  "shapely>=2.0,<3.0",
]

[project.optional-dependencies]
export = [
  "openpyxl>=3.1,<4.0",
  "pyarrow>=14,<22",
]
analytics = [
  "duckdb>=1.1,<2.0",
  "h3>=4.1,<5.0",
]
privacy = [
  "scikit-learn>=1.4,<2.0",
]
viz = [
  "folium>=0.16,<1.0",
]
notebook = [
  "ipykernel>=6.29,<7.0",
]
docs = [
  "mkdocs-material>=9.5,<10.0",
  "mkdocstrings[python]>=0.25,<1.0",
  "mkdocs-jupyter>=0.25,<1.0",
]
dev = [
  "nbformat>=5.10,<6.0",
  "pytest>=8.2,<9.0",
  "scikit-learn>=1.4,<2.0",
  "build>=1.2,<2.0",
  "twine>=5.1,<7.0",
]

[project.urls]
Homepage = "https://xyt.situee.ch"
Documentation = "https://xyt.situee.ch"
Repository = "https://github.com/action-situee/xyt-gps"
Issues = "https://github.com/action-situee/xyt-gps/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
